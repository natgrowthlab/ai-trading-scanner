services:
  postgres:
    restart: unless-stopped
    ports: []
  redis:
    restart: unless-stopped
    ports: []
  api:
    restart: unless-stopped
    ports: []
  worker:
    restart: unless-stopped
  web:
    restart: unless-stopped
    ports: []
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
